# Copy this file to .streamlit/secrets.toml and fill in your actual values
# DO NOT commit secrets.toml to GitHub!

[schwab]
client_id = "your_schwab_client_id_here"
client_secret = "your_schwab_client_secret_here"
redirect_uri = "https://127.0.0.1"

# Optional: Add any other configuration
[app]
refresh_interval = 15
max_strikes = 50
